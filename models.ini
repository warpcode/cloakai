# + diff) was truncated to 389 tokens by the gateway ("kept 1/2 messages") ->
# LFM3 invented archetypal commit messages at the gateway's temp 0.7 override.
# Cause chain: /props n_ctx reports PER-SLOT context (16384 = 32768 total / 2
# slots at parallel=2); the gateway treats it as per-request capacity (correct),
# reserves ~9.8k for output, then drops input messages instead of capping
# max_tokens. The prompt would have fit one slot with ~8.8k headroom. Fleet
# audit same day (12 seats probed): every preset serves its FULL declared ctx
# (per-slot x parallel = declared); --fit never shrank anything. Fix lives in
# VSCode settings: github.copilot.llm-gateway.modelContextWindows.
# Config plate: vendor general beat (temp 0.1, top-k 50, repeat-penalty 1.1).
# Math: QAD-Q4_0 0.98 GiB + KV ~0.2 GiB (only 6 attn layers carry KV @ 32k)
# -> ~1.8 GB, 100% iGPU with room for 2-3 parallel slots.
#
# HISTORY: Qwen3-4B-Instruct-2507 was incumbent from the fleet's founding until
# 2026-10-29 (dethroned per the A/B above; never lost on quality - lost on speed).
# Non-thinking refresh (no trace at all), 98.9% schema-valid at <=8 GB class,
# MUST be used with temp <= 0.7. License-gated on HF (401 breaks commit
# resolution); the unsloth mirror is identical weights and ungated. Fallback
# retired 2026-10-30 per "remove the losers": cache blobs deleted (~2.5 GiB
# Q4_K_M reclaimed; re-downloadable via the unsloth mirror if LFM3's 1.7B ever
# shows a structured-output regression at scale).
# 2026-10-30: Copilot commit-gen tool-call leak incident (RESOLVED same day; fixed by
# reasoning-budget = 128, NOT by removing the scaffold). Copilot's SCM commit-gen request
# carries a `commit` tool (message param) and the gateway forwards tools/tool_choice
# verbatim, so llama.cpp's jinja template renders the tool definitions into the prompt
# using the template's serialized function-call syntax. Chained probes against the seat
# (b11968, live):
#   - budget 0 (then-incumbent config, no-think prefill): generation starts AFTER the
#     think block is already closed; the model copies the serialized call format into
#     bare content mid-stream -> llama.cpp cannot parse it -> raw markup lands in the
#     commit message box. Reproduced deterministically with tools + tool_choice "none".
#   - forced enable_thinking (unlimited): structured parsed tool_calls, no leak, but
#     traces on short-output extractors would regress (the 2026-10-29 chatty-trace drain).
#   - reasoning-budget = 128 (current): enough planning window for the 1.7B to emit the
#     serialized call well-formed (parsed into structured tool_calls), far below the
#     785-token chatty-trace drain. Paired with reasoning-preserve = false so traces are
#     stripped from history and multi-turn calls don't re-pay planning tokens.
#   - no-tools control: no serialized markup at all - the scaffold is NECESSARY but not
#     sufficient; the leak needs the no-think prefill. Scaffold-only fixes (gateway
#     enableToolCalling false / stripped per-seat template) stay optional defense-in-depth.
# Other seats received the same forwarded scaffold and ignored it ("worked fine"); the
# leak is LFM3-at-budget-0-specific. ctx-size also 32768 -> 65536 with cache-type-v q8_0
# (per-slot 32768 = the modelContextWindows value the gateway budgets against).
# 2026-10-30: quant and KV experiments (Q8_0 weights, F16 KV) reverted same day
# per user call - extra GiB cost is parallel-slot headroom, and QAD-Q4_0 is
# already near-lossless QAT. Original w=QAD-Q4_0 / KV q8_0/q8_0 config below.
# Over-think fix lives on [reason-fast] (budget 2048); this seat stays at 128.
hf-repo = LiquidAI/LFM3-1.7B-GGUF:QAD-Q4_0
ctx-size = 65536
batch-size = 2048
ubatch-size = 256
parallel = 2
cache-type-k = q8_0
cache-type-v = q8_0
reasoning-budget = 128
temp = 0.1
top-k = 50
repeat-penalty = 1.1

