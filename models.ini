# TEST CASE 3: [reason-low] (Qwen3.5-4B) + MTP speculative decoding. Same model,
# weights from the -MTP- repo whose UD-Q4_K_XL (2.78 GiB) adds the single NextN
# block (+0.07 GiB vs plain 2.71). Self-drafting: no separate drafter file.
#
# Support verified in build 11873 (2026-10-26): llama_model_qwen35::graph_mtp
# compiled symbols + "QWEN35 MTP" validation strings in libllama; spec-type
# draft-mtp is a first-class --spec-type value.
# Why it should NOT reproduce [reason]'s -28% MTP slowdown: that measurement was
# caused by fit-overflow pushing 1-2 layers to CPU and breaking the speculate
# path (34-layer cliff). At 2.78 GiB in the ~6.8 GB pool there is ~4 GB headroom
# -> zero overflow expected. Remaining unknown: draft-mtp throughput on RADV
# Vulkan - empirically untested on this box (same status as draft-dflash/
# draft-dspark). Field data on other backends (Bonsai 27B MTP, CUDA): ~+26%.
# Tuning knob: spec-draft-n-max (default 3) - single NextN block drafts
# sequentially; lower to 1-2 if acceptance is poor. Acceptance on thinking
# traces skews high on math/code, weaker on prose.
# 2026-10-27 RESULT: test PASSED and kept as an optional tier. 47,359 tok cold
# prefill @ 29.1 tok/s (parity with plain - spec decode does not touch prefill),
# ZERO ring resets, decode 10.4 tok/s vs 9.0 plain = +15.4%. Below the +26%
# CUDA field data (RADV path + prose-heavy probe); acceptance should skew
# higher on math/code traces. Costs: a second 2.78 GiB cache copy + slower
# child spawn. Route heavy-code delegations here when decode-bound.
hf-repo = unsloth/Qwen3.5-4B-MTP-GGUF:UD-Q4_K_XL
