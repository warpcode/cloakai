# ==============================================================================
# 0. GLOBAL DEFAULTS (Ryzen 5600H Stock GTT + Safe CPU Overflow)
# ==============================================================================
[*]
# fit = on + gpu-layers = auto lets llama-server query available RADV GTT memory
# and keep 1536 MiB free so the iGPU never crashes or hangs the desktop session.
fit = on
fit-target = 1024
fit-ctx = 16384
# Opportunistic KV reuse for stable prefixes (system/preamble). Inert when no
# repeated chunk >= 256 tokens exists; requires prompt caching (default on).
cache-reuse = 256
gpu-layers = auto
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
context-shift = false
# repack = true optimises any layers that overflow to Zen 3 CPU cores (AVX2)
repack = true
warmup = false
backend-sampling = true
op-offload = true
# 4 generation / 6 batch threads ensure fast execution if a few layers overflow to CPU
threads = 4
threads-batch = 6
batch-size = 1024
ubatch-size = 512
poll = 0
poll-batch = 0
prio = 0
prio-batch = 0
parallel = 1
jinja = true


# ==============================================================================
# 1. CHAT & WEB RAG
# ==============================================================================
# ==============================================================================
# 1. GENERAL CHAT, WRITING & WEB RAG
# ==============================================================================
[chat]
# Model: Gemma 4 E4B (4.5B active / 8B PLE). Weights: ~4.39 GiB (IQ4_XS).
# Context: 2 parallel slots x 131,072 tokens.
# Split KV: q8_0 Keys preserve needle-in-a-haystack routing; q4_0 Values save 420MB.
# Total Footprint: ~4.7 GB (weights) + ~1.33 GB (split KV) + ~0.45 GB (buffers) ≈ ~6.48 GB.
# Fits 100% inside your ~6.8 GB usable iGPU pool with fit-target = 1024.
hf-repo = unsloth/gemma-4-E4B-it-GGUF:IQ4_XS
ctx-size = 131072
parallel = 2
cache-type-k = q8_0
cache-type-v = q4_0
ubatch-size = 512
no-mmproj = true
context-shift = true
temp = 1.0
top-p = 0.95
top-k = 64


# ==============================================================================
# 2. CODING, FIM & DEEP REASONING
# ==============================================================================
[fim]
# Tasks: Low-latency IDE inline autocomplete (Fill-In-the-Middle).
# Specs: ~2.43 GB total at 8k -> 100% iGPU.
hf-repo = Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M
ctx-size = 16384
temp = 0
context-shift = true
cache-reuse = 256
cache-ram = 512
parallel = 2
ubatch-size = 128

[code]
# Model: Spark-X2.6-4B (4B dense, 3:1 SWA hybrid attention). Weights: ~3.16 GiB (Q5_K_M).
# Tasks: Daily coding, single-file edits, multi-file repo diffs, unit test fixing & SWE-bench Pro bug fixes.
# Benchmarks: 62.8% SWE-bench Verified, 54.3% SWE-bench Pro, 62.4 MCP-Atlas.
# Specs: 98304 (96k) context; 3:1 SWA keeps KV light (~1.3 GB split KV), total GTT ~4.9 GB -> 100% iGPU.
# Note: No native MTP heads; speculative decoding accelerated via ngram-mod.
hf-repo = bartowski/Spark-X2.6-4B-GGUF:Q5_K_M
ctx-size = 98304
cache-type-k = q8_0
cache-type-v = q4_0
ubatch-size = 256
parallel = 2
no-mmproj = true
temp = 0.2
top-p = 0.9
spec-type = ngram-mod
spec-ngram-mod-n-match = 16
spec-ngram-mod-n-min = 8
spec-ngram-mod-n-max = 12

[reason]
# Model: Ornith-1.5-9B (9B dense, self-improving RL scaffold).
# Benchmarks: 70.6% SWE-bench Verified, 47.0% Terminal-Bench 2.1, 86.4% GPQA Diamond.
# Tasks: Complex agentic delegation, multi-step CLI tool loops, architecture design & hard bug root cause.
# Specs: ~6.33 GB total at 32k; overflows 1-2 layers cleanly to CPU if GTT is tight.
# Note: No native MTP heads; speculative decoding accelerated via ngram-mod.
hf-repo = abenzerps/Ornith-1.5-9B-GSQ-RCO-GGUF:Q4_K_M
ctx-size = 32768
ubatch-size = 256
no-mmproj = true
temp = 0.6
top-p = 0.95
top-k = 20
spec-type = ngram-mod
spec-ngram-mod-n-match = 16
spec-ngram-mod-n-min = 8
spec-ngram-mod-n-max = 12


# ==============================================================================
# 3. VISION & OCR
# ==============================================================================
[vision]
# Tasks: UI screenshot debugging, component state checks, diagrams & visual QA.
# Upgraded to LFM3-VL-2B (2026-10-28 A/B winner, takes the seat from MiniCPM-V-4.7-1B).
# Requires llama.cpp b11946+ (box runs b11968). QAD-Q4_0 weights 0.98 GiB + Q8_0 mmproj
# 0.35 GiB (auto-attached) + tiny KV (tri-hybrid: only 6 attn layers carry KV, conv
# layers are constant-state) + buffers ~0.45 = ~1.9 GB -> 100% iGPU with headroom.
#
# 2026-10-28 A/B VERDICT vs MiniCPM-V-4.7-1B (real 1920x1080 desktop screenshot +
# synthetic text/dashboard/square/chart probes, b11968, crop-verified boxes):
#   (a) UI recall/text: both perfect on all text probes (screen title transcription,
#       dashboard status readout, synthetic text lines + count).
#   (b) Grounding: LFM3 wins decisively. IoU vs generous ground truth on the window
#       box: LFM3 0.897 vs MiniCPM 0.729; on the bottom status-bar box: 0.765 vs
#       0.079 (MiniCPM missed the bar entirely on the raw read). MiniCPM's wide-
#       dashboard failure mode is guessing ("assuming standard layout") instead of
#       locating. LFM3 LOCATES, then reports.
#   (c) Diagram reading: tie - both read title/bar order/highest correctly on the
#       fixed synthetic bar chart; LFM3 in 43 tok, MiniCPM in 167 tok with waffle.
#   - Speed: MiniCPM 32-37 tok/s raw; LFM3 26-31 tok/s (budget 0), image prefill
#     172-207 tok/s. LFM3's default thinking trace BLOWS token budgets on complex
#     visual QA (2000 tok without finishing a 3-part screenshot question) ->
#     reasoning-budget = 0 is REQUIRED config for this slot (validated pattern).
#   - COORDINATE SPACE (critical for consumers): BOTH models report boxes in a
#     native ~1000x1000 processing canvas, NOT true pixels. Consume with the
#     deterministic rescale: true = reported * (img_w/1000, img_h/1000). LFM3's
#     rescaled boxes landed <2 px from truth on the synthetic square probe and
#     0.897 IoU on the real screenshot; MiniCPM same canvas, worse placement.
# MiniCPM-V-4.7-1B history (incumbent 2026-10-27 -> dethroned 2026-10-28): strong
# text reader and faster raw decode, but unreliable grounding on complex layouts;
# kept out of the fleet per protocol. Blobs stay cached (~1.6 GiB, Q8_0 + mmproj).
hf-repo = LiquidAI/LFM3-VL-2B-GGUF:QAD-Q4_0
ctx-size = 16384
batch-size = 2048
ubatch-size = 256
flash-attn = on
reasoning-budget = 0
temp = 0.2
top-k = 50
repeat-penalty = 1.1

# [vision-ab-test] removed 2026-10-28 at seat-swap: LFM3-VL-2B won the full three-criterion
# A/B vs MiniCPM-V-4.7-1B (grounding IoU 0.897 vs 0.729, status-bar 0.765 vs 0.079, diagrams
# and text tie) and took the [vision] seat. The section's previous candidate (LFM2.5-VL-3B)
# was never raced; superseded by the newer generation. MiniCPM-V blobs stay cached (~1.6 GiB).

[ocr]
# Tasks: Receipts, invoices, nested tables, LaTeX formulas & multi-column PDFs (#1 OmniDocBench v1.6).
hf-repo = PaddlePaddle/PaddleOCR-VL-1.6-GGUF:Q8_0
ctx-size = 8192
batch-size = 2048
ubatch-size = 1024
temp = 0


