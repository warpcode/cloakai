# Model: LFM3-1.7B (Liquid AI, tri-hybrid: 13 gated short conv + 5 sliding-window
# attn + 6 global attn, 1.73B params, native 256k ctx, LFM Open License v1.0).
# Fast-lane delegation slot, taking the seat 2026-10-28 from Granite 4.0 H-Tiny.
# llama.cpp support: PR #31252, merged Oct 27 2026 (needs b11946+, box runs
# b11968 - official Ubuntu Vulkan x64 release asset, installed to
# mise llama-cpp tree as 11968; mise remote has not published >=11946 yet).
#
# Why it wins the fast seat (2026-10-28 40k rig, standalone :8082 with run.sh
# env, QAD-Q4_0 quant 0.98 GiB):
#   - Deep prefill: 43,480 tok cold in 431 s = 100.9 tok/s sustained - fastest
#     in fleet (Granite ~80). Conv layers carry constant-size recurrent state,
#     so NO ~1/depth decay and no deep-KV crash shape at all (delta fp: only 6
#     layers carry KV, 12,288 bytes/token -> 64k ctx KV is tiny).
#   - Decode: 25.7 tok/s (256-tok probe), unchanged at depth - fleet leader
#     (Granite 19.3, MiniCPM5 15.1, Bolt-plain 7.2, [reason] 6.25).
#   - Thinking scaffold works by default; deep-rig outputs opened proper traces.
#   - Quality (Liquid harness, same-class peers): avg 49.37 tops the small
#     class, beating Qwen3.5-9B (47.24) at 1/5 the RAM; SWE-V(OpenCode) 43.4,
#     BFCL-V4 71.4, ToolSandbox 80.4, IFEval 96.7, LCB v6 73.5, GPQA-D 63.4,
#     AA-LCR 52.8, RULER-128K 65.6. Card still warns: not for complex
#     multi-step reasoning - the fleet ladder decides empirically.
#   - Sampler: vendor general beat (temp 0.1, top-k 50, repeat penalty 1.1);
#     thinking on by default (enable_thinking=False documented as inconsistent).
#   - Stability gate: zero ring events, SCLK pegged 1500 the whole leg - passed
#     without needing any of the single-KV-head mitigations the fleet relied on.
# 2026-10-30: Q8_0 + KV F16 experiments reverted same day (user call): back to
# QAD-Q4_0 weights and q8_0/q4_0 KV - the extra GiB cost slot headroom the box
# can't spare, and QAD-Q4_0 is already near-lossless QAT. Original config below.
# 2026-10-30: V-cache q4_0 -> q8_0 at user direction (K already q8_0). Costs
# ~0.25 GiB extra KV @ 64k ctx vs the q8_0/q4_0 original - modest, and removes
# the fleet's most aggressive KV quant from this seat's deep-context lane.
# reasoning-budget = 2048 ADDED same day. Complaint: unbounded thinking burns
# thousands of tokens on wild tangents. Cap forces convergence on the fast lane
# while leaving a real window for multi-step scaffold use ([utility] runs 128,
# [vision] 0; worst-case cap-hitting decode ~80 s at 25.7 tok/s).
