[utility]
# Tasks: Command generation/summaries, text classification, tag generation,
# structured (JSON/grammar) output. Fast, deterministic, no thinking traces.
# Model: Qwen3-4B-Instruct-2507 — non-thinking refresh (no reasoning trace at
# all), best-in-class schema-valid JSON at <=8 GB (98.9% validity, 91.7%
# field accuracy, Q4_K_M). Benchmarks: MUST be used with temp <= 0.7.
# Specs: ~2.5 GiB weights (Q4_K_M). ctx-size = 32768 / parallel = 2 ->
# 16k per slot. Split KV (q8/q4) ≈ ~1.9 GB across all 32k tokens.
# Qwen/Qwen3-4B-Instruct-2507-GGUF is license-gated on HF (401 for unauthenticated
# API calls, which breaks commit resolution -> "exactly one out metadata, path_model..."
# startup error). unsloth mirror is identical weights and ungated.
hf-repo = unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
ctx-size = 32768
batch-size = 2048
ubatch-size = 256
parallel = 2
cache-type-k = q8_0
cache-type-v = q4_0
temp = 0
top-p = 0.8
presence-penalty = 1.5

[embed]
# Tasks: Obsidian vault semantic search & codebase RAG indexing.
hf-repo = ggml-org/embeddinggemma-2-GGUF:Q8_0
ctx-size = 8192
embeddings = true
