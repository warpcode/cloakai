[asr-ab-test]
# A/B CANDIDATE vs [asr] (Qwen3-ASR-0.6B). English-only dictation challenger.
# Model: parakeet-unified-en-0.6b (NVIDIA, FastConformer + RNN-T transducer, unified
# streaming/offline). Handy's independent bench: 3.99% WER at 25.3x realtime on 4750U-class
# GPU vs Qwen3-ASR-0.6B 4.23% at 9.7x - slightly more accurate and ~2.6x faster, 0.68 GB.
# GGUF WER (LibriSpeech test-clean, handy-computer): Q8_0 1.60% / Q5_K_M 1.58% / F16 1.59%
# - quantisation is a wash, so take the smaller Q5_K_M (541 MB).
# Built-in punctuation + capitalisation; ~24 min max utterance per pass.
# Runtime caveat (IMPORTANT): this is a transcribe.cpp GGUF port, NOT a llama.cpp build.
# Serve via transcribe-cli (handy-computer/transcribe.cpp); the fit/gpu-layers keys below are
# inert placeholders kept so the launcher can iterate both sections without special-casing.
# License: NVIDIA Open Model License (inherited from nvidia/parakeet-unified-en-0.6b).
# Card WER table (LibriSpeech test-clean, offline): Q5_K_M 1.58% is the best quant; Q8_0 1.60%.
hf-repo = handy-computer/parakeet-unified-en-0.6b-gguf:Q5_K_M
ctx-size = 2048
# A/B protocol: same dictation corpus (accent mix + domain vocabulary) through [asr] and this
# section; score (a) WER by hand-spot-check, (b) first-token latency, (c) tok/s realtime factor.
# If parakeet wins, [asr] flips to it and this section is deleted; Qwen3-ASR stays only if
# multilingual dictation (52 languages) is ever needed - parakeet is English-only.
