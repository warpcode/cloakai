# cloakai network topology.
#
# The principle: MEMBERSHIP OF THE internal NETWORK IS THE CAPABILITY GRANT.
#
#   Add a container to `internal`    -> grant a capability
#   Remove it                        -> revoke it
#
# The plugin's mcp.json is the POLICY layer. This file is the ENFORCEMENT layer.
# They compose: a plugin cannot grant a tool that is not on the network, and the
# agent cannot reach anything it did not declare.
#
# Why the agent cannot curl, git clone or npm install: it is not a bug, it is the
# design. Web access becomes something you DEPLOY AS A TOOL rather than something
# the container has ambiently. It is also fully reversible — adding a capability
# container on both networks grants a specific tool the ability to reach out, with
# no architectural change. See issue #19.
#
# Verified in docs/verification/phase-0.md Check 4: a container on `internal` only
# cannot reach the internet (a real timeout, not a 403), and a container on
# `internal` + `egress` can. Both halves matter — the first proves the boundary,
# the second proves the boundary is the only thing stopping it.

services:
  # The only route off this machine. The agent holds a scoped virtual key and never
  # a provider credential, so a prompt injection cannot spend a real one.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      # Absolute when dev.sh supplies it, relative-to-infra/ otherwise. It must NOT
      # depend on --project-directory: that changed resolution to the repo root,
      # so `./litellm.yaml` resolved to a path that did not exist, docker created an
      # empty DIRECTORY there, and litellm silently started with no model list.
      - ${CLOAKAI_LITELLM_CONFIG:-./litellm.yaml}:/app/config.yaml:ro
      # LiteLLM authenticates every request against a key database. Without one it
      # fails auth with a misleading "No connected db.", which surfaces to the
      # agent as an AI_APICallError rather than as a proxy problem.
      #
      # SQLite is not accepted: virtual keys and spend tracking require Postgres.
      # That is not incidental — a scoped key with a spend cap is only meaningful
      # if something durable records what it has spent.
      - litellm-data:/data
    environment:
      # A spend cap is the second half of the credential story. The key alone
      # bounds nothing on its own.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cloakai-dev-not-a-secret}
      DATABASE_URL: postgresql://cloakai:${POSTGRES_PASSWORD:-cloakai-dev-not-a-secret}@postgres:5432/litellm
      # Without this the image never reads the mounted config: the proxy starts,
      # authenticates keys, and then reports no models at all. It fails as
      # "Invalid model name" on the request rather than as a config error.
      CONFIG_FILE_PATH: /app/config.yaml
      # Which upstream `default` forwards to. The compose `test` profile points
      # this at infra/mock-upstream.py so test 8 needs no provider key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-upstream-not-a-secret}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://mock-upstream:4001/v1}
    networks: [internal, egress]
    # Without this the proxy starts alongside postgres and races it, failing
    # auth on first boot with the same misleading "No connected db." that a
    # genuinely missing database produces.
    depends_on:
      postgres:
        condition: service_healthy
    # Without this, `docker compose up --wait` treats the service as ready the
    # moment it starts, so `dev.sh up` would report success before the proxy can
    # answer a request. The liveliness endpoint is the proxy's own.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # The credential store. internal ONLY: the agent can reach it, and it cannot
  # reach the internet. Putting the key database on egress would hand the internet
  # a path to every virtual key cloakai has issued.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cloakai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloakai-dev-not-a-secret}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloakai -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # A real model call needs a real upstream. With no provider key configured, this
  # stands in for one so isolation test 8 can prove the whole path works rather
  # than skipping the only test that shows the container can still do its job.
  # The `test` profile means it never starts with the normal topology, and it sits
  # BEHIND litellm, so the proxy, network, credentials and isolation are all real.
  # Test-only: swap the model list in litellm.yaml for a real provider instead.
  mock-upstream:
    image: python:3.12-slim
    command: ["python", "/srv/upstream.py"]
    volumes:
      - ${CLOAKAI_MOCK_UPSTREAM:-./mock-upstream.py}:/srv/upstream.py:ro
    networks: [egress]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4001/v1/models', timeout=5).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles: ["test"]

  # On both networks, deliberately. This is a capability container: it can reach
  # the internet while the agent cannot. It exists to prove that, not to serve
  # traffic. Nothing in `run` mode talks to it.
  capability-probe:
    image: curlimages/curl:latest
    entrypoint: ["sleep", "3600"]
    networks: [internal, egress]
    profiles: ["test"]

  # ---------------------------------------------------------------------
  # The agent.
  #
  # EVERY isolation flag below is also in agents/isolation-flags, and they are
  # kept in step deliberately. Compose has no way to read that file, so the two
  # cannot literally share a source; scripts/dev.sh and scripts/isolation-tests.sh
  # both verify they agree, and a mismatch fails the build rather than shipping a
  # compose service that is less isolated than the one you tested.
  #
  # The project directory is an env var, not a fixed path, with `.` as the default.
  # A hardcoded path here is the kind of thing that quietly breaks someone six
  # months later when they check the repo out elsewhere. See "How this fits
  # together" in the README.
  # ---------------------------------------------------------------------
  dev-agent:
    image: ${AGENT_IMAGE:-cloakai/dev:latest}
    # mcp-http, not mcp. The dev-agent service is reached over the compose network
    # by scripts/conformance.sh at http://dev-agent:8081/mcp. The portable stdio
    # contract is `docker run --rm cloakai/dev mcp`, which needs no service.
    command: ["mcp-http"]
    # A workspace is OPT-IN, and it is opted into HERE, deliberately, for one
    # reason: `dev.sh shell` is for poking at your own project interactively.
    #
    # This service is the interactive one. A client that spawns the container
    # itself gets NO workspace unless it asks for one — that is the difference
    # between dev and execution, and isolation test 5b asserts it.
    #
    # Set AGENT_PROJECT= (empty) to run this service with no workspace at all.
    # Relative to the compose PROJECT DIRECTORY, which scripts/dev.sh pins to the
    # repo root via --project-directory.
    volumes:
      - ${AGENT_PROJECT:-.}:/workspace
    working_dir: /workspace
    # --read-only with four tmpfs mounts, one per writable path the agent needs
    # (/tmp, /root/.local, /root/.config, /root/.cache). Each is required and each
    # was found by reading the next EROFS. See docs/verification/phase-0.md.
    read_only: true
    tmpfs:
      - /tmp
      - /root/.local
      - /root/.config
      - /root/.cache
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: 4g
    cpus: 2.0
    networks: [internal]
    # NO published ports, deliberately. The container is reachable by DNS name on
    # `internal` only, which is where a spawned agent container will find it. Publishing it
    # would expose an isolated agent to the host for no gain — and a published
    # port on a network shared with an untrusted agent is a hole in the design.
    #
    # If you ever need one for debugging, bind it to 127.0.0.1 and remove it after.
    # ports: ["127.0.0.1:8081:8081"]
    healthcheck:
      # A real probe, not `--version`. The binary existing says nothing about the
      # service serving; an MCP initialize round trip does.
      test:
        - CMD
        - /usr/local/bin/cloakai-healthcheck
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  # No route to the internet. Container-to-container traffic and compose service
  # name DNS still work, which is the whole point: the agent can reach litellm.
  internal:
    internal: true
    name: ${CLOAKAI_NETWORK:-cloakai-internal}

  # Default bridge. A container needs this to leave the machine.
  egress: {}

volumes:
  # LiteLLM's key/spend database. Named, so it survives restarts and is not
  # written into the image.
  litellm-data:
  # The credential store backing it.
  litellm-db:
